name: Build and Test

on: [push, workflow_dispatch]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install OpenMPI and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openmpi-bin \
            libopenmpi-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Build fscull
        run: |
          make MPI_CXX_LIBS=-lmpi_cxx

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          echo "== $(date -u +'%Y-%m-%dT%H:%M:%SZ') starting make test =="
          status=0
          timeout --signal=TERM --kill-after=30s 10m \
            make test EXTRA_MPIRUN_ARGS="--mca btl self,tcp --oversubscribe" || status=$?
          echo "== $(date -u +'%Y-%m-%dT%H:%M:%SZ') finished make test status=$status =="
          if [ "$status" -ne 0 ]; then
            echo "== process snapshot after failure ==" >&2
            ps -ef >&2
            exit "$status"
          fi
