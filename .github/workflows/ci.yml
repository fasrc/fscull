name: Build and Test

on: [push, workflow_dispatch]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install OpenMPI and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openmpi-bin \
            libopenmpi-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Build fscull
        run: |
          make MPI_CXX_LIBS=-lmpi_cxx

      - name: Run tests
        env:
          OMPI_MCA_orte_abort_on_non_zero_status: "0"
          PRTE_MCA_state_base_error_non_zero_exit: "0"
        run: |
          make test EXTRA_MPIRUN_ARGS="--mca btl self,tcp --oversubscribe"
