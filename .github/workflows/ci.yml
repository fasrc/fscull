name: Build and Test

on: [push, workflow_dispatch]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install OpenMPI and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openmpi-bin \
            libopenmpi-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Build fscull
        run: |
          cd src
          make -f Makefile.non_autoconf

      - name: Run tests
        run: |
          export PATH="${GITHUB_WORKSPACE}/src:${PATH}"
          cd tests
          make EXTRA_MPIRUN_ARGS="--mca btl self,tcp --oversubscribe"
