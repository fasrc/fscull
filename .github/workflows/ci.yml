name: Build and Test

on: [push, workflow_dispatch]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install OpenMPI and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openmpi-bin \
            libopenmpi-dev \
            autoconf \
            automake \
            libtool \
            pkg-config

      - name: Build fscull
        run: |
          make MPI_CXX_LIBS=-lmpi_cxx

      - name: Run tests (pretend)
        run: ./tests/run_ci_target.sh pretend

      - name: Run tests (normal)
        run: ./tests/run_ci_target.sh normal

      - name: Run tests (longpath)
        run: ./tests/run_ci_target.sh longpath

      - name: Run tests (externaltrash)
        run: ./tests/run_ci_target.sh externaltrash

      - name: Run tests (collision)
        run: ./tests/run_ci_target.sh collision

      - name: Run tests (safetyfail)
        run: ./tests/run_ci_target.sh safetyfail

      - name: Run tests (symlinkroots)
        run: ./tests/run_ci_target.sh symlinkroots

      - name: Run tests (argfail)
        run: ./tests/run_ci_target.sh argfail
